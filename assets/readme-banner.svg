<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Duplicate Finder</title><desc id="d">Matching file fingerprints are identified and grouped.</desc><defs><linearGradient id="bg"><stop stop-color="#1b283b"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#14253a" stroke-width="3"><rect x="120" y="90" width="160" height="130" rx="12" stroke="#62e3c1"/><rect x="350" y="90" width="160" height="130" rx="12" stroke="#62e3c1"/><rect x="810" y="90" width="160" height="130" rx="12" stroke="#a89bff"/></g><g fill="#edf3ff" font-family="monospace" font-size="14" text-anchor="middle"><text x="200" y="155">FILE A</text><text x="430" y="155">FILE B</text><text x="890" y="155">HASH MATCH</text></g><path d="M280 155H350M510 155H810" stroke="#62e3c1" stroke-width="3" stroke-dasharray="9 8"><animate attributeName="stroke-dashoffset" values="0;-68" dur="2.5s" repeatCount="indefinite"/></path><circle cx="660" cy="155" r="30" fill="none" stroke="#62e3c1" stroke-width="3"><animate attributeName="r" values="25;34;25" dur="2.5s" repeatCount="indefinite"/></circle><text x="660" y="161" text-anchor="middle" fill="#edf3ff" font-family="monospace" font-size="14">SHA</text><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">DUPLICATE FINDER</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">HASH / COMPARE / VERIFY</text></svg>