<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Duplicate Finder animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">
    Duplicate Finder
  </text>
  <text x="400" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">SHA-256 · zero dependencies · one python file</text>

  <!-- files row: pairs of duplicates blink red when scanned -->
  <g>
    <rect x="130" y="100" width="40" height="52" rx="5" fill="#475569"/>
    <rect x="210" y="100" width="40" height="52" rx="5" fill="#475569"/>
    <rect x="290" y="100" width="40" height="52" rx="5" fill="#f87171">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="370" y="100" width="40" height="52" rx="5" fill="#475569"/>
    <rect x="450" y="100" width="40" height="52" rx="5" fill="#f87171">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="530" y="100" width="40" height="52" rx="5" fill="#475569"/>
    <rect x="610" y="100" width="40" height="52" rx="5" fill="#475569"/>
  </g>

  <!-- link between the two duplicates -->
  <path d="M310 96 Q380 60 470 96" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- scanning magnifier -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="100,0;520,0;100,0" dur="6s" repeatCount="indefinite"/>
    <circle cx="50" cy="126" r="22" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <line x1="66" y1="142" x2="82" y2="160" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
